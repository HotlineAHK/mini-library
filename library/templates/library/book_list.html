<h1>Книги</h1>
<table border="1" cellpadding="6">
  <tr><th>Название</th><th>Автор</th><th>Год</th></tr>
  {% for book in books %}
  <tr>
    <td>{{ book.title }}</td>
    <td>{{ book.author.name }}</td>
    <td>{{ book.year }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="3">Книг пока нет</td></tr>
  {% endfor %}
</table>
<p><a href="{% url 'book_create' %}">Добавить книгу</a></p>
